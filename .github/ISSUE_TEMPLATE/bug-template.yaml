name: "Bug Report"
description: Report something that's broken or behaving unexpectedly in the SDK.
title: "[Bug]: "
labels: ["type: bug", "status: new"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please fill in what you can — a code sample that reproduces the issue is the most helpful thing you can include.

  - type: input
    id: sdk-version
    attributes:
      label: SDK Version
      description: "`go list -m github.com/michaeldcanady/servicenow-sdk-go` or your go.mod pin."
      placeholder: v2.0.0
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go Version
      placeholder: go1.25.0
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Closest match — see the package list in the repo root if unsure.
      options:
        - table-api
        - attachment-api
        - batch-api
        - case-api
        - cdm (applications/changesets/editor)
        - cmdb (cmdb-instance-api)
        - documents-api
        - account-api
        - actsub-api (activity subscription)
        - aggregation-api (stats)
        - appointment-booking-api
        - app-service-api
        - authentication / credentials
        - core / request pipeline
        - all / cross-cutting
        - other / not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal Go code that triggers the bug. Redact instance URLs and credentials.
      render: go
    validations:
      required: true

  - type: textarea
    id: error-output
    attributes:
      label: Error output (if any)
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Related issues, ServiceNow version/plugin config, etc.
    validations:
      required: false
