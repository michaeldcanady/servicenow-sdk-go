# Branch protection policy for the servicenow-sdk-go repository.
# Declarative companion to ADR 011 (release-branch policy, #658): `main` is
# the next-major trunk; `release/v*` are downstream-only maintenance lines
# whose hard guarantees live here. Following the same schema Microsoft's
# Kiota repositories use for branch protection as code, this file is the
# single reviewed source of truth for those settings.
#
# Live enforcement is hybrid so Scorecard v5.5.0 detects it (see
# website/docs/contributing/release-branch-protection.md): `main` is
# enforced via classic branch protection (branches/main/protection) and
# `release/v*` via a repository ruleset
# (servicenow-sdk-go-release-protection). Both are applied from this
# declaration — the file alone does not protect anything until applied.

name: servicenow-sdk-go-branch-protection
description: Branch protection policy for the servicenow-sdk-go repository
resource: repository
configuration:
  branchProtectionRules:

  - branchNamePattern: main

    # Specifies whether this branch can be deleted. boolean
    allowsDeletions: false
    # Specifies whether forced pushes are allowed on this branch. boolean
    allowsForcePushes: false
    # Specifies whether new commits pushed to the matching branches dismiss pull request review approvals. boolean
    dismissStaleReviews: true
    # Specifies whether admins can overwrite branch protection. boolean
    isAdminEnforced: false
    # Indicates whether "Require a pull request before merging" is enabled. boolean
    requiresPullRequestBeforeMerging: true
    # Specifies the number of pull request reviews before merging. int (0-6). Should be null/empty if PRs are not required
    requiredApprovingReviewsCount: 1
    # Require review from Code Owners. Requires requiredApprovingReviewsCount. boolean
    requireCodeOwnersReview: true
    # Are commits required to be signed. boolean.
    requiresCommitSignatures: false
    # Are conversations required to be resolved before merging? boolean
    requiresConversationResolution: true
    # Are merge commits prohibited from being pushed to this branch. boolean
    requiresLinearHistory: false
    # Required status checks to pass before merging. Only checks that report on
    # every PR belong here — path-filtered jobs (build/test, build-site,
    # lint-md) would stick "pending" forever on PRs they skip. Values can be any
    # string, but if the value does not correspond to any existing status check,
    # the status check will be stuck on pending since nothing exists to push an actual status.
    requiredStatusChecks:
    - Check Branch Name
    - Check Linked Issue
    - Validate PR Title
    - CodeQL
    # Require branches to be up to date before merging. This should be false since the repo contains autogenerated files (release-please owns VERSION and CHANGELOG.md). boolean
    requiresStrictStatusChecks: false
    # Indicates whether there are restrictions on who can push. boolean. Should be set with whoCanPush.
    restrictsPushes: false
    # Restrict who can dismiss pull request reviews. boolean
    restrictsReviewDismissals: false

  # Maintenance lines (ADR 011 rule 3): downstream-only, cut lazily from
  # tags. Same guarantees as main plus required linear history — cherry-pick
  # backports must stay reviewable one-to-one without merge bubbles hiding
  # what actually shipped on the line.
  - branchNamePattern: release/v*

    allowsDeletions: false
    allowsForcePushes: false
    dismissStaleReviews: true
    isAdminEnforced: false
    requiresPullRequestBeforeMerging: true
    requiredApprovingReviewsCount: 1
    requireCodeOwnersReview: true
    requiresCommitSignatures: false
    requiresConversationResolution: true
    requiresLinearHistory: true
    requiredStatusChecks:
    - Check Branch Name
    - Check Linked Issue
    - Validate PR Title
    - CodeQL
    requiresStrictStatusChecks: false
    restrictsPushes: false
    restrictsReviewDismissals: false
