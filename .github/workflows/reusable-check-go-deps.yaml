name: Check Go Dependencies

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version to use (e.g. stable, oldstable, 1.20)"
        required: false
        default: "stable"
        type: string
      package-path:
        description: "Directory containing the Go package to check"
        required: false
        default: "."
        type: string

concurrency:
  group: check-deps-go-${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.go-version }}-${{ inputs.package-path }}
  cancel-in-progress: true

permissions: {}

jobs:
  check-deps:
    name: Check Go Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout and check dependencies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check root module tidiness
        uses: ./.github/actions/check-go-deps
        with:
          package-path: ${{ inputs.package-path }}
          go-version: ${{ inputs.go-version }}
