name: OpenCode Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
  issue_comment:
    types:
      - created

concurrency:
  group: opencode-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    name: AI Code Review (opencode/big-pickle)
    # Auto-review when an owner / member / collaborator opens, reopens, or
    # marks a PR ready for review. Skip auto-review when the PR description
    # contains `/no-bot-review`. Manual re-review (including for outside
    # contributions) when an owner / member / collaborator comments
    # `/oc review` or `/opencode review`; the explicit trigger overrides the
    # skip marker.
    if: |
      (
        github.event_name == 'pull_request' &&
        (
          github.event.pull_request.author_association == 'OWNER' ||
          github.event.pull_request.author_association == 'MEMBER' ||
          github.event.pull_request.author_association == 'COLLABORATOR'
        ) &&
        !contains(github.event.pull_request.body, '/no-bot-review')
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        (
          contains(github.event.comment.body, ' /oc review') ||
          startsWith(github.event.comment.body, '/oc review') ||
          contains(github.event.comment.body, ' /opencode review') ||
          startsWith(github.event.comment.body, '/opencode review')
        ) &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # read the repository; read-only, so the review can't push or commit
      pull-requests: write # post inline review comments and the summary review
      id-token: write # sign in to OpenCode with the job's OIDC token (see the sign-in step)
      # issues: write and contents: write are omitted on purpose, so the
      # token can't create branches, commits, or pull requests.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      # Pinned OpenCode 2 CLI. OpenCode removed its GitHub Action in
      # anomalyco/opencode#59032, and the v1 installer can't install OpenCode 2,
      # so this job installs the CLI from npm and runs `opencode run` itself.
      # To upgrade, change the version and copy the package's `dist.integrity`
      # from https://registry.npmjs.org/@opencode/cli-linux-x64/<version>.
      # Dependabot can't update this pin.
      OPENCODE_VERSION: 2.2.5
      OPENCODE_INTEGRITY: sha512-BkHAfTqNsg/qphyHNrnH+DGkOxZsGjamNpM5DvwoEvz7ZAPNw8mEbMXGTCDOAH+/+40Eqeie6KNZBZZQwPCjaA==
    steps:
      # SECURITY POSTURE — read before changing anything here.
      #
      # OpenCode is an agentic runner, so this job contains it:
      #
      #   * pull_request trigger (NOT pull_request_target): fork PRs get no
      #     OIDC token and a read-only GITHUB_TOKEN, so the sign-in fails
      #     closed for them. The job-level `if` also limits the job to owners,
      #     members, and collaborators.
      #   * The checkout is the event's default ref: the PR merge ref on
      #     pull_request, and the default branch on issue_comment. A comment
      #     on a fork PR never checks out the fork's code, so the fork can't
      #     supply an opencode.json, .opencode/ directory, or AGENTS.md that
      #     OpenCode would load. The review reads the PR through `gh` instead.
      #   * contents: read only, so the token can't push, commit, or open PRs.
      #     All it can do is post pull request reviews (pull-requests: write).
      #   * The inline config denies file edits and web fetches. `--auto`
      #     approves only permissions that aren't explicitly denied.
      #   * The prompt lives in this file, not in the checkout, so a PR can't
      #     change the instructions of a comment-triggered review.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # Trades the job's GitHub OIDC token for a short-lived OpenCode token.
      # OPENCODE_CLIENT_ID is a public client identifier, so it's a repository
      # variable, not a secret. The token is masked before anything else can
      # print it, and it reaches the review step only as a step output, not
      # through GITHUB_ENV.
      - name: Sign in to OpenCode
        id: opencode-auth
        shell: bash
        env:
          AUDIENCE: https://opencode.ai/console
          OPENCODE_CLIENT_ID: ${{ vars.OPENCODE_CLIENT_ID }}
        run: |
          oidc="$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)"
          echo "::add-mask::$oidc"
          token="$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id="$OPENCODE_CLIENT_ID" \
            -d subject_token="$oidc" | jq -r .access_token)"
          if [[ -z "$token" || "$token" == "null" ]]; then
            echo "::error::OpenCode sign-in returned no access token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      # Downloads the pinned CLI from npm and checks it against the pinned
      # integrity hash before extracting it.
      - name: Install OpenCode
        id: opencode-install
        shell: bash
        run: |
          dir="$RUNNER_TEMP/opencode"
          mkdir -p "$dir"
          tarball="$dir/cli.tgz"
          curl -sSfL -o "$tarball" \
            "https://registry.npmjs.org/@opencode/cli-linux-x64/-/cli-linux-x64-${OPENCODE_VERSION}.tgz"
          actual="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          if [[ "$actual" != "$OPENCODE_INTEGRITY" ]]; then
            echo "::error::OpenCode $OPENCODE_VERSION doesn't match the pinned integrity hash."
            exit 1
          fi
          tar -xzf "$tarball" -C "$dir"
          bin="$dir/package/bin/opencode"
          "$bin" --version
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: Run OpenCode review
        shell: bash
        timeout-minutes: 15
        env:
          OPENCODE_BIN: ${{ steps.opencode-install.outputs.bin }}
          OPENCODE_API_KEY: ${{ steps.opencode-auth.outputs.token }}
          # Deny file edits and web fetches, and give the title agent the free
          # review model. Passing --title below also skips title generation.
          OPENCODE_CONFIG_CONTENT: '{"small_model":"opencode/big-pickle","permission":{"edit":"deny","webfetch":"deny"}}'
          REVIEW_PROMPT: |
            You are reviewing a pull request in a GitHub repository. The
            repository, pull request number, and head commit SHA are at the end
            of this message.

            Your ONLY job is to post review feedback. You must NOT modify any
            files, create branches, open pull requests, commit, or push code.
            You may not run destructive commands. Reviewing and posting
            comments is all you may do.

            Read the pull request with the `gh` CLI. The working directory
            might not contain the pull request's changes, so don't rely on it
            for the changed files:

            - `gh pr view <number> --repo <repository>` for the title and
              description.
            - `gh pr diff <number> --repo <repository>` for the diff.
            - `gh api "repos/<repository>/contents/<path>?ref=<head commit SHA>" --jq .content | base64 -d`
              for the full head version of a file.

            Review the changed lines, read surrounding context for accuracy,
            and focus on correctness, bugs, security, and maintainability.

            For every issue that genuinely needs attention (a real bug, a
            security problem, or a defect that will cause confusion later),
            post an INLINE review comment on the exact changed line:

            ```
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /repos/<repository>/pulls/<number>/comments \
              -f 'body=<summary of the issue>' \
              -f 'commit_id=<head commit SHA>' \
              -f 'path=<path-to-file>' \
              -F 'line=<exact line number in the head version>' \
              -f 'side=RIGHT'
            ```

            Put each comment on the exact line that needs the change and
            describe the finding precisely. If you have a concrete suggested
            fix, include it in a suggestion code block, but don't invent one
            when a plain explanation is clearer.

            Then post ONE concise overall review summary:

            ```
            gh pr review <number> --repo <repository> --comment --body '<summary>'
            ```

            The summary is a short verdict (for example, "Looks good",
            "Requesting changes", or "Approving with minor nits") followed by
            a few bullet points for the most important findings. Don't paste
            long diffs or repeat every inline comment.

            If you find no actionable findings, post a short passing summary
            instead of inventing comments. Don't request cosmetic churn (style
            nits, renames, formatting) unless it prevents confusion or future
            defects.
        run: |
          head_sha="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid)"
          prompt="$REVIEW_PROMPT
          Repository: $REPO
          Pull request number: $PR_NUMBER
          Head commit SHA: $head_sha"
          "$OPENCODE_BIN" run \
            --standalone \
            --auto \
            --model opencode/big-pickle \
            --title "Review of $REPO#$PR_NUMBER" \
            "$prompt"
