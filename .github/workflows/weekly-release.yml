name: Weekly Preview Release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # Weekly preview release (every Monday at 3 AM UTC)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout and change detection
    outputs:
      should_release: ${{ steps.determine.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Needed to fetch all tags

      - name: Get latest tag
        id: latest_tag
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")" >> $GITHUB_OUTPUT

      # Only runs when a prior tag exists. On a first run (no tags yet) there's
      # nothing to diff against, so this step is skipped rather than relying on
      # tj-actions/changed-files' undocumented behavior for an empty base_sha.
      - name: Check for changes since latest tag
        id: diff
        if: ${{ steps.latest_tag.outputs.tag != '' }}
        uses: ./.github/actions/detect-changes
        with:
          checkout: "false"
          base_sha: ${{ steps.latest_tag.outputs.tag }}

      - name: Determine whether to release
        id: determine
        env:
          TAG: ${{ steps.latest_tag.outputs.tag }}
          ANY_CHANGED: ${{ steps.diff.outputs.any_changed }}
        run: |
          if [ -z "$TAG" ]; then
            echo "No prior tag found; defaulting should_release=true for first run."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=$ANY_CHANGED" >> "$GITHUB_OUTPUT"
          fi

  release-please:
    name: Create Weekly Preview Release
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create preview release PR and tag
      issues: write # label preview release PR
      pull-requests: write # open preview release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create preview release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: weekly-release-please-config.json

  # Attach provenance assets to the preview release, using the same reusable
  # workflows as Stable Release so previews get the same SBOM and signatures.
  attach-sbom:
    name: Attach SBOM to Release
    needs: release-please
    if: >-
      needs.release-please.result == 'success' &&
      needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # callee uploads the SBOM asset to the GitHub release
    uses: ./.github/workflows/sbom.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  attach-sign:
    name: Sign Release Artifacts and Tag
    needs: [attach-sbom, release-please]
    if: >-
      needs.release-please.result == 'success' &&
      needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # callee uploads signature assets and force-pushes the signed tag
      id-token: write # callee signs keylessly with the OIDC identity
    uses: ./.github/workflows/sign-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # Runs the full quality gate against the tagged ref. The release-please
  # tag push is invisible to the `push tags` trigger (GITHUB_TOKEN events do
  # not start new runs), so this must be called in-band. See
  # release-verify.yml for both trigger paths.
  verify-release:
    name: Verify Release Against Full Quality Gate
    needs: [attach-sign, release-please]
    if: >-
      needs.release-please.result == 'success' &&
      needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read # checkout and verification
    uses: ./.github/workflows/release-verify.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
