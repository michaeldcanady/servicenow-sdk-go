name: CodeQL Analysis

on:
  workflow_call:
    inputs:
      language:
        description: "Programming language to analyze"
        type: string
        default: "go"
      category:
        description: "SARIF category label (for example '/language:go')"
        type: string
        default: "/language:go"

permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read # CodeQL workflow metadata (private repo)
      contents: read # checkout
      security-events: write # SARIF upload

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ inputs.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: ${{ inputs.category }}
