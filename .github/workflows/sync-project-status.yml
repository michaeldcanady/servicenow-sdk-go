# Bidirectional sync between project board Status field and issue labels.
#
# - Move issue to "In Progress" on board → "status: in progress" label added
# - Add "status: in progress" label → board Status updates to "🏗 In progress"
# - Conflicts resolved by timestamp (most recent wins)
#
# Requires a classic PAT with `project` scope (fine-grained tokens don't support Projects v2).

name: Sync Project Status

on:
  schedule:
    - cron: '0 * * * *'  # hourly (was every 15 min; a PAT-bearing cron should not run that hot)
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply changes (false = preview only)'
        type: boolean
        default: false

permissions: {}

jobs:
  check-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      has-token: ${{ steps.check.outputs.has-token }}
    steps:
      - id: check
        env:
          HAS_TOKEN: ${{ secrets.PROJECT_PAT != '' }}
        run: echo "has-token=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

  sync:
    needs: check-secret
    if: needs.check-secret.outputs.has-token == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout for sync action
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dvhthomas/project-label-sync@3717399ea3afad24da809603d1006148dbf94688 # v0.1.2
        with:
          token: ${{ secrets.PROJECT_PAT }}
          apply: ${{ github.event.inputs.apply || 'false' }}
