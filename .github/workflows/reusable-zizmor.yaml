name: GitHub Actions Security Analysis (zizmor)

on:
  workflow_call:
    inputs:
      version:
        description: "zizmor CLI version to install"
        type: string
        default: "1.29.0"
      online-audits:
        description: "Enable online audits (requires network access)"
        type: boolean
        default: true
      advanced-security:
        description: "Upload SARIF results to GitHub code scanning"
        type: boolean
        default: false
      min-severity:
        description: "Minimum severity level to report"
        type: string
        default: "informational"
      min-confidence:
        description: "Minimum confidence level to report"
        type: string
        default: "low"

permissions: {}

jobs:
  zizmor:
    name: Run zizmor -- blocking
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: "."
          collect: all
          persona: auditor
          min-severity: ${{ inputs.min-severity }}
          min-confidence: ${{ inputs.min-confidence }}
          version: ${{ inputs.version }}
          online-audits: ${{ inputs.online-audits }}
          advanced-security: false

  zizmor-sarif:
    name: Run zizmor -- SARIF upload
    if: ${{ inputs.advanced-security }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
      actions: read # upload-sarif workflow metadata (private repos)
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor (SARIF)
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: "."
          collect: all
          persona: auditor
          min-severity: ${{ inputs.min-severity }}
          min-confidence: ${{ inputs.min-confidence }}
          version: ${{ inputs.version }}
          online-audits: ${{ inputs.online-audits }}
          advanced-security: true
