name: CI
on:
  # Dispatch forces the full matrix with no path filtering, for on-demand
  # re-runs of the whole gate.
  workflow_dispatch:
  # Run the full matrix weekly, independent of PR activity. Tuesdays 03:00 UTC
  # avoids Scorecard (Mon 01:30), the weekly release (Mon 03:00), e2e-nightly
  # (daily 04:00), the stale bot (daily 05:30), and CodeQL (Fri 03:00).
  schedule:
    - cron: "0 3 * * 2"
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "**.go"
      - "!docs/snippets/**"
      - "tests/integration/**"
      - "**/*.feature"
      - ".golangci.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/quality-gate.yml"
      - ".github/workflows/reusable-*.yml"
  pull_request:
    paths:
      - "**.go"
      - "!docs/snippets/**"
      - "tests/integration/**"
      - "**/*.feature"
      - ".golangci.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/quality-gate.yml"
      - ".github/workflows/reusable-*.yml"
concurrency:
  # Scheduled runs carry no head_ref or ref, so without the run_id fallback
  # every weekly run shares one bare group key and cancel-in-progress drops
  # whichever started first. run_id gives each its own slot; push, PR, and
  # dispatch grouping are unchanged.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

env:
  COVERAGE_FILE: coverage.out

permissions: {}

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # changed-files detection via checkout
    # Release-please PRs are no longer exempt: they bump version.go (compiled
    # code) and must pass the same gates as any other change before a tag is cut.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    outputs:
      code: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Changed Files
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        id: filter
        uses: NerdIT-Tech/.github/.github/actions/detect-changes@56a6f78118ca762e717675dc48ba10ead5bf8b5c # v0.1.0
        with:
          checkout: "false"
          # The single source of truth for the quality gate's footprint; keep in
          # lockstep with the push/PR trigger paths above.
          files: |
            **.go
            !docs/snippets/**
            tests/integration/**
            **/*.feature
            .golangci.yml
            .github/workflows/ci.yml
            .github/workflows/quality-gate.yml
            .github/workflows/reusable-*.yml
  quality-gate:
    name: Quality Gate
    needs:
      - changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read # read-only gate; per-leg permissions live in the gate
    uses: ./.github/workflows/quality-gate.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
