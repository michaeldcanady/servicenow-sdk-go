name: CI
on:
  workflow_dispatch:
  # Run the full matrix weekly, independent of PR activity. Tuesdays 03:00 UTC
  # avoids Scorecard (Mon 01:30), the weekly release (Mon 03:00), e2e-nightly
  # (daily 04:00), the stale bot (daily 05:30), and CodeQL (Fri 03:00).
  schedule:
    - cron: "0 3 * * 2"
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "**.go"
      - "!docs/snippets/**"
      - "tests/integration/**"
      - "**/*.feature"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**.go"
      - "!docs/snippets/**"
      - "tests/integration/**"
      - "**/*.feature"
      - ".github/workflows/ci.yml"
      - ".golangci.yml"

concurrency:
  # Scheduled runs carry no head_ref or ref, so without the run_id fallback
  # every weekly run shares one bare group key and cancel-in-progress drops
  # whichever started first. run_id gives each its own slot; push, PR, and
  # dispatch grouping are unchanged.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

env:
  COVERAGE_FILE: coverage.out

permissions: {}

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # changed-files detection via checkout
    # Release-please PRs are no longer exempt: they bump version.go (compiled
    # code) and must pass the same gates as any other change before a tag is cut.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule'
    outputs:
      code: ${{ github.event_name == 'schedule' || steps.filter.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Changed Files
        if: github.event_name != 'schedule'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: filter
        with:
          files: |
            **.go
            !docs/snippets/**
            tests/integration/**
            **/*.feature
            .github/workflows/ci.yml

  check-go:
    name: Check Go Modules
    needs:
      - changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout only; no push or release
    strategy:
      matrix:
        go-version: ["stable", "oldstable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning] -- check-go does not publish release artifacts; Go module cache is safe for pull_request builds
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - run: go mod download
      - run: go mod verify
      - name: Check root module tidiness
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check integration test module tidiness
        run: |
          cd tests/integration/v2
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  build-go:
    name: Build Go Code
    needs:
      - changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["stable", "oldstable"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read # checkout and build
      pull-requests: write # no PR creation; write used only if build artifacts require comment (auditor requires justification)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning] -- build-go does not publish release artifacts; cache is safe for pull_request builds
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Build Go Code
        run: |
          PACKAGES=$(go list ./... | grep -v "/docs")
          go build $PACKAGES

  lint-go:
    name: Lint Go Code
    needs:
      - changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout and lint
    strategy:
      fail-fast: false
      matrix:
        go-version: ["stable", "oldstable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning] -- lint-go does not publish artifacts; default Go cache is safe
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          install-mode: goinstall
          version: v2.13.0
          skip-cache: false
          args: --timeout=5m

  test-go:
    name: Test Go Code
    needs:
      - changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["stable", "oldstable"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read # checkout and test
      pull-requests: write # sticky PR comment on failure
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning] -- test-go does not publish release artifacts; default Go cache is safe
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install tparse
        run: |
          go install github.com/mfridman/tparse@v0.18.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Run Tests & Report
        run: .github/scripts/report-tests.sh
        id: test-run
      - name: Prepare Test Summary
        if: failure()
        id: create-summary
        run: |
          echo "SUMMARY<<EOF" >> $GITHUB_OUTPUT
          head -c 60000 test-summary.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Post Sticky Comment
        if: failure()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: test-failure-summary
          message: ${{ steps.create-summary.outputs.SUMMARY }}
      - name: Delete Test Failure Comment
        if: success()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: test-failure-summary
          delete: true

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && matrix.go-version == 'stable'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./${{ env.COVERAGE_FILE }}
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env] -- CODECOV_TOKEN is a repo secret for coverage upload, not a deployment secret; scoped to step env and not requiring GitHub environment protection

  integration-test-go:
    name: Integration Tests (mocked)
    needs:
      - changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout and mocked integration tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning] -- integration-test-go does not publish artifacts; cache is safe
        with:
          go-version: "stable"
          cache: true
      - name: Run integration tests
        env:
          SN_OFFLINE: "true"
          SN_INSTANCE: mock_instance
          SN_USERNAME: mock_user
          SN_PASSWORD: mock_password
        run: |
          cd tests/integration/v2
          go test -tags integration ./...

  tag-gated-test-go:
    name: Tag-Gated Tests (preview.query)
    needs:
      - changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout and preview.query tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 # zizmor: ignore[cache-poisoning] -- tag-gated-test-go does not publish artifacts; cache is safe
        with:
          go-version: "stable"
          cache: true
      - name: Run preview.query tests
        run: go test -tags preview.query ./internal/...

  govulncheck:
    name: Vulnerability Scan
    needs:
      - changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # govulncheck via default checkout handled by action
    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: stable
          go-package: ./...
