name: CI
on:
  # Dispatch forces the full matrix with no path filtering, for on-demand
  # re-runs of the whole gate.
  workflow_dispatch:
  # Run the full matrix weekly, independent of PR activity. Tuesdays 03:00 UTC
  # avoids Scorecard (Mon 01:30), the weekly release (Mon 03:00), e2e-nightly
  # (daily 04:00), the stale bot (daily 05:30), and CodeQL (Fri 03:00).
  schedule:
    - cron: "0 3 * * 2"
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "**.go"
      - "!docs/snippets/**"
      - "tests/integration/**"
      - "**/*.feature"
      - ".golangci.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**.go"
      - "!docs/snippets/**"
      - "tests/integration/**"
      - "**/*.feature"
      - ".golangci.yml"
      - ".github/workflows/ci.yml"
concurrency:
  # Scheduled runs carry no head_ref or ref, so without the run_id fallback
  # every weekly run shares one bare group key and cancel-in-progress drops
  # whichever started first. run_id gives each its own slot; push, PR, and
  # dispatch grouping are unchanged.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

env:
  COVERAGE_FILE: coverage.out

permissions: {}

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # changed-files detection via checkout
    # Release-please PRs are no longer exempt: they bump version.go (compiled
    # code) and must pass the same gates as any other change before a tag is cut.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    outputs:
      code: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Changed Files
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        id: filter
        uses: NerdIT-Tech/.github/.github/actions/detect-changes@56a6f78118ca762e717675dc48ba10ead5bf8b5c # v0.1.0
        with:
          checkout: "false"
          # The single source of truth for the quality gate's footprint; keep in
          # lockstep with the push/PR trigger paths above.
          files: |
            **.go
            !docs/snippets/**
            tests/integration/**
            **/*.feature
            .golangci.yml
            .github/workflows/ci.yml
  check-go:
    name: Check Go Modules
    needs:
      - changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read # checkout only; no push or release
    strategy:
      matrix:
        go-version: ["stable", "oldstable"]
        package-path: [".", "tests/integration/v2"]
    uses: NerdIT-Tech/.github/.github/workflows/reusable-check-go-deps.yml@518c3ac639edb7c8bdecf70cedbca4763a31af35 # v0.1.1
    with:
      go-version: ${{ matrix.go-version }}
      package-path: ${{ matrix.package-path }}

  build-go:
    name: Build Go Code
    needs:
      - changes
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"
          - "windows-latest"
        go-version:
          - "stable"
          - "oldstable"
    if: ${{ needs.changes.outputs.code == 'true' }}
    uses: NerdIT-Tech/.github/.github/workflows/reusable-build-go.yml@0744b42f50f33960c6135cb7fa2d8345067b5f6a # v0.1.1
    permissions:
      contents: read
    with:
      os: ${{ matrix.os }}
      go-version: ${{ matrix.go-version }}

  lint-go:
    name: Lint Go Code
    needs:
      - changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ["stable", "oldstable"]
    uses: NerdIT-Tech/.github/.github/workflows/reusable-lint-go.yml@606cae6a534ebfeac3db1a153921b85abde3c26f # v0.1.1
    permissions:
      contents: read # checkout and lint
    with:
      go-version: ${{ matrix.go-version }}

  test-go:
    name: Test Go Code
    needs:
      - changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"
          - "windows-latest"
        go-version:
          - "stable"
          - "oldstable"
    uses: NerdIT-Tech/.github/.github/workflows/reusable-test-go.yml@3289533fd243ff3fdbc47df296c4f596d546f819 # v0.1.1
    permissions:
      contents: read # checkout and build
      pull-requests: write # sticky PR comment on failure
    with:
      os: ${{ matrix.os }}
      go-version: ${{ matrix.go-version }}
      package-path: "./..."
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration-test-go:
    name: Integration Tests (mocked)
    needs:
      - changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    uses: NerdIT-Tech/.github/.github/workflows/reusable-test-go.yml@3289533fd243ff3fdbc47df296c4f596d546f819 # v0.1.1
    permissions:
      contents: read # checkout and mocked integration tests
      pull-requests: write # sticky PR comment on failure
    with:
      os: "ubuntu-latest"
      go-version: "stable"
      go-build-flags: "-tags integration"
      working-directory: "./tests/integration/v2"
      package-path: ./...
      coverage-file: ""
      env-vars: |
        SN_OFFLINE=true
        SN_INSTANCE=mock_instance
        SN_USERNAME=mock_user
        SN_PASSWORD=mock_password

  govulncheck:
    name: Vulnerability Scan
    needs:
      - changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    uses: NerdIT-Tech/.github/.github/workflows/reusable-govulncheck.yml@90df6901560cd004f015dd84b799b613b8af6001 # v0.1.0
    permissions:
      contents: read # govulncheck via default checkout handled by action
