name: CI
on:
  workflow_dispatch:
  # Run the full matrix weekly, independent of PR activity. Tuesdays 03:00 UTC
  # avoids Scorecard (Mon 01:30), the weekly release (Mon 03:00), e2e-nightly
  # (daily 04:00), the stale bot (daily 05:30), and CodeQL (Fri 03:00).
  schedule:
    - cron: "0 3 * * 2"
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "**.go"
      - "!docs/snippets/**"
      - "tests/integration/**"
      - "**/*.feature"
      - ".github/workflows/ci.yml"
      - ".github/workflows/reusable-lint-go.yaml"
      - ".github/workflows/reusable-test-go.yaml"
      - ".github/actions/check-go-deps"
      - ".github/actions/install-tparse"
      - ".github/actions/go-test"
      - ".github/workflows/reusable-build-go.yaml"
      - ".github/workflows/reusable-check-go-deps.yaml"
      - ".github/workflows/reusable-govulncheck.yaml"
  pull_request:
    paths:
      - "**.go"
      - "!docs/snippets/**"
      - "tests/integration/**"
      - "**/*.feature"
      - ".github/workflows/ci.yml"
      - ".golangci.yml"
      - ".github/workflows/reusable-lint-go.yaml"
      - ".github/workflows/reusable-test-go.yaml"
      - ".github/actions/check-go-deps/action.yml"
      - ".github/actions/install-tparse/action.yml"
      - ".github/actions/go-test/action.yml"
      - ".github/workflows/reusable-build-go.yaml"
      - ".github/workflows/reusable-check-go-deps.yaml"
      - ".github/workflows/reusable-govulncheck.yaml"
concurrency:
  # Scheduled runs carry no head_ref or ref, so without the run_id fallback
  # every weekly run shares one bare group key and cancel-in-progress drops
  # whichever started first. run_id gives each its own slot; push, PR, and
  # dispatch grouping are unchanged.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

env:
  COVERAGE_FILE: coverage.out

permissions: {}

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # changed-files detection via checkout
    # Release-please PRs are no longer exempt: they bump version.go (compiled
    # code) and must pass the same gates as any other change before a tag is cut.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule'
    outputs:
      code: ${{ github.event_name == 'schedule' || steps.filter.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Changed Files
        if: github.event_name != 'schedule'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: filter
        with:
          files: |
            **.go
            !docs/snippets/**
            tests/integration/**
            **/*.feature
            .github/workflows/ci.yml
            .github/workflows/reusable-lint-go.yaml
            .github/workflows/reusable-test-go.yaml
            .github/workflows/reusable-build-go.yaml
            .github/actions/check-go-deps/action.yml
            .github/actions/install-tparse/action.yml
            .github/actions/go-test/action.yml
            .github/workflows/reusable-check-go-deps.yaml
            .github/workflows/reusable-govulncheck.yaml
  check-go:
    name: Check Go Modules
    needs:
      - changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read # checkout only; no push or release
    strategy:
      matrix:
        go-version: ["stable", "oldstable"]
        package-path: [".", "tests/integration/v2"]
    uses: ./.github/workflows/reusable-check-go-deps.yaml
    with:
      go-version: ${{ matrix.go-version }}
      package-path: ${{ matrix.package-path }}

  build-go:
    name: Build Go Code
    needs:
      - changes
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"
          - "windows-latest"
        go-version:
          - "stable"
          - "oldstable"
    if: ${{ needs.changes.outputs.code == 'true' }}
    uses: ./.github/workflows/reusable-build-go.yaml
    permissions:
      contents: read
    with:
      os: ${{ matrix.os }}
      go-version: ${{ matrix.go-version }}

  lint-go:
    name: Lint Go Code
    needs:
      - changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ["stable", "oldstable"]
    uses: ./.github/workflows/reusable-lint-go.yaml
    with:
      go-version: ${{ matrix.go-version }}

  test-go:
    name: Test Go Code
    needs:
      - changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"
          - "windows-latest"
        go-version:
          - "stable"
          - "oldstable"
    uses: ./.github/workflows/reusable-test-go.yaml
    permissions:
      contents: read # checkout and build
      pull-requests: write # sticky PR comment on failure
    with:
      os: ${{ matrix.os }}
      go-version: ${{ matrix.go-version }}
      package-path: "./..."

  integration-test-go:
    name: Integration Tests (mocked)
    needs:
      - changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    uses: ./.github/workflows/reusable-test-go.yaml
    permissions:
      contents: read # checkout and mocked integration tests
      pull-requests: write # sticky PR comment on failure
    with:
      os: "ubuntu-latest"
      go-version: "stable"
      go-build-flags: "-tags integration"
      working-directory: "./tests/integration/v2"
      package-path: ./...
      coverage-file: ""
      sn-offline: ${{ 'true' }}
      sn-instance: mock_instance
      sn-username: mock_user
      sn-password: mock_password

  govulncheck:
    name: Vulnerability Scan
    needs:
      - changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    uses: ./.github/workflows/reusable-govulncheck.yaml
    permissions:
      contents: read # govulncheck via default checkout handled by action
