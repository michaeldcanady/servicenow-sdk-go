# Documentation preview — the per-change lifecycle. Everything that happens
# while a PR is open: quality gates on the changed content, a live preview,
# and cleanup when the PR closes.
#
# Pair file: docs-stable.yml owns the merge-to-main lifecycle (full-site scan
# + publishing the canonical site). The two deliberately diverge on triggers:
  #   * .vale.ini / .github/actions/check-snippet-regions/** are CHECKER configuration:
#     changing them must re-run checks (this file watches them) but produces
#     no new site output, so detect-changes below excludes them and a
#     rules-only PR never publishes a pointless preview.
#   * Whole-repo prose scanning never gates a PR — PRs lint changed files
#     only (#666); drift in untouched files is caught at the stable gate.
#     A dispatch run CAN scan the full site, so the exact stable scoping can
#     be proven by hand before relying on it (#683).
#
# Previews are non-gating by intent (they are a reading aid, not a check);
# failed lints show red without blocking the preview publish. The BUILD,
# however, is a first-class per-PR check (verify-build) that runs on every
# push — including forks — and deploy-preview only publishes what it built.
#
# release-please branches need no special-casing: their PRs touch only
# CHANGELOG.md/VERSION/version.go (verified in .release-please-config.json).
name: Documentation Preview

on:
  workflow_dispatch:
  pull_request:
    # `closed` drives preview cleanup.
    types: [opened, reopened, synchronize, closed]
    paths:
      - "website/**"
      - ".vale.ini"
      - ".github/actions/check-snippet-regions/**"
      - ".github/workflows/docs-preview.yml"
      - ".github/actions/docs-build/**"
      - ".github/actions/vet-go-snippets/**"
      - ".github/actions/check-snippet-regions/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout for change detection
    # `action` is unset on dispatch, so this skips ONLY close events.
    if: github.event.action != 'closed'
    outputs:
      docs: ${{ steps.diff.outputs.any_changed }}
      markdown: ${{ steps.changed-md.outputs.any_changed }}
      markdown-files: ${{ steps.changed-md.outputs.all_changed_files }}
    steps:
      # Local actions resolve from the workspace, so something must be checked
      # out before the action below can be found at all — its internal
      # checkout step can never be the thing that bootstraps this.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect site-output changes
        id: diff
        uses: ./.github/actions/detect-changes
        with:
          checkout: "false"
          # Site-output-affecting paths only — keep in lockstep with
          # docs-stable.yml's copy so "should publish" means the same thing
          # in both lifecycles. Checker config (.vale.ini, the regions
          # script) intentionally absent: see header.
          files: |
            website/**
            .github/workflows/docs-preview.yml
            .github/actions/docs-build/**

      - name: Changed markdown files
        id: changed-md
        uses: ./.github/actions/detect-changes
        with:
          checkout: "false"

  lint-md:
    name: lint-md
    runs-on: ubuntu-latest
    needs:
      - detect-changes
    timeout-minutes: 10
    permissions:
      contents: read # checkout and Vale lint
    if: github.event.action != 'closed' && needs.detect-changes.outputs.markdown == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Vale Linter (changed content)
        uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          fail_on_error: true
          files: ${{ needs.detect-changes.outputs.markdown-files }}
          separator: ","
          level: error
          version: 3.18.0

  lint-snippets:
    name: lint-snippets
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-check-snippets.yaml

  verify-build:
    name: verify-build
    permissions:
      contents: read # checkout and site build
    if: github.event.action != 'closed'
    uses: ./.github/workflows/reusable-docs-build.yaml
    with:
      base-url: ${{ github.event_name == 'pull_request' && format('/servicenow-sdk-go/pr-preview/pr-{0}/', github.event.number) || '/servicenow-sdk-go/' }}
      upload-artifact: true

  deploy-preview:
    name: deploy-preview
    needs:
      - detect-changes
      - verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # pushes PR preview to gh-pages branch
      pull-requests: write # pr-preview-action posts preview URL via sticky comment (auditor requires comment)
    if: >-
      github.event.action != 'closed' &&
      needs.detect-changes.outputs.docs == 'true'
    concurrency:
      group: docs-preview-${{ github.event.number }}
      cancel-in-progress: true # a superseded push's preview is worthless
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: website/build

      # Fork PRs get a read-only token, so publishing is same-repo only.
      - name: Deploy preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: website/build
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto

  remove-preview:
    name: remove-preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # required: rewrites gh-pages to drop the preview dir
      pull-requests: write # same embedded comment step as deploy-preview
    # Independent of detect-changes: closes must clean up even when the
    # closing push itself carries no docs changes.
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Remove preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
