# Documentation stable — the merge-to-main lifecycle. One gate job and one
# sequential publish job: scan the whole site, verify the snippet contract,
# build with production settings, swap the canonical site root.
#
# Pair file: docs-preview.yml owns the per-PR lifecycle (changed-content
# lint, live previews, cleanup). Trigger divergence between the two is
# deliberate — see that file's header:
#   * This file does NOT watch .vale.ini, scripts/check-snippet-regions.sh,
#     or .github/actions/vet-go-snippets/**, .github/actions/check-snippet-regions/** (checker configuration produces no
#     new site output; it is executed here, just never a rebuild trigger).
#   * This workflow has no workflow_dispatch on purpose: the canonical site
#     is only ever published by a main push, never by hand. To exercise the
#     build recipe manually, dispatch docs-preview.yml's verify-build.
#
# The whole-tree prose scan lives HERE rather than on PRs (#661): PR scoping
# deliberately tolerates drift in untouched files, so the release gate is
# where it gets caught. The snippet contract is re-asserted here for the same
# reason — cheap insurance against any path into main that skipped a PR.
#
# release-please branches need no special-casing: their PRs touch only
# CHANGELOG.md/VERSION/version.go (verified in .release-please-config.json),
# and this workflow triggers on pushes to main regardless of branch name.
name: Documentation Stable

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/docs-stable.yml"
      - ".github/actions/docs-build/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout for change detection
    outputs:
      docs: ${{ steps.diff.outputs.any_changed }}
    steps:
      # Local actions resolve from the workspace, so something must be checked
      # out before the action below can be found at all — its internal
      # checkout step can never be the thing that bootstraps this.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect site-output changes
        id: diff
        uses: NerdIT-Tech/.github/.github/actions/detect-changes@56a6f78118ca762e717675dc48ba10ead5bf8b5c  # v0.1.0
        with:
          checkout: "false"
          # Keep in lockstep with docs-preview.yml's copy so "should
          # publish" means the same thing in both lifecycles.
          files: |
            website/**
            .github/workflows/docs-stable.yml
            .github/actions/docs-build/**

  gate-stable:
    name: gate-stable
    needs: [detect-changes]
    if: needs.detect-changes.outputs.docs == 'true'
    permissions:
      contents: read # Vale lint and snippet checks
    uses: NerdIT-Tech/.github/.github/workflows/reusable-docs-gate.yml@9bb3bee679bd6bf6f3915701803eaeb089ee769c  # v0.1.1

  deploy-stable:
    name: deploy-stable
    needs: [detect-changes, gate-stable]
    if: needs.detect-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # pushes built site to gh-pages branch (auditor requires comment)
    # Serialize every writer to gh-pages: stable deploys, per-PR previews, and
    # preview removals share one named group so last-write races can't let a
    # stale build win (see docs-preview.yml for the shared group).
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build site
        uses: NerdIT-Tech/.github/.github/actions/docs-build@c83e367706b5593dc2e74adb4e486e13e052ed43  # v0.1.0
        with:
          analytics-domain: michaeldcanady.github.io

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: website/build
          clean: true
          # Keep live PR previews intact on stable deploys.
          clean-exclude: pr-preview/
