name: Build Go Code

on:
  workflow_call:
    inputs:
      os:
        description: 'JSON array of runner OSes, e.g. ["ubuntu-latest","macos-latest","windows-latest"]'
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      go-version:
        description: 'JSON array of Go versions, e.g. ["stable","oldstable"]'
        type: string
        default: '["stable", "oldstable"]'

permissions: {}

jobs:
  build-go:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        go-version: ${{ fromJSON(inputs.go-version) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read # checkout and build
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        # zizmor: ignore[cache-poisoning] -- build-go: setup-go saves caches only on default-branch refs; PR/fork runs only restore, so no fork-persisted cache reaches trusted runs
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Build Go Code
        run: |
          PACKAGES=$(go list ./... | grep -v "/docs")
          go build $PACKAGES
