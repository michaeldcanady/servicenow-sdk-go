name: Go Vulnerability Check

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version to use (e.g. stable, oldstable, 1.20)"
        required: false
        default: "stable"
        type: string
      go-package:
        description: "Go package path to scan (e.g. ./...)"
        required: false
        default: "./..."
        type: string
      checkout-ref:
        description: "Ref to check out before scanning; empty checks out the event ref"
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  govulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout and govulncheck scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout-ref }}
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: ${{ inputs.go-version }}
          go-package: ${{ inputs.go-package }}
          repo-checkout: "false" # checked out above, at the requested ref