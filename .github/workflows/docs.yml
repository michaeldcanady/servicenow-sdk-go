name: Documentation CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".vale.ini"
      - "scripts/check-snippet-regions.sh"
      - ".github/workflows/docs.yml"
  pull_request:
    # `closed` is needed so the PR preview gets cleaned up on merge/close.
    types: [opened, reopened, synchronize, closed]
    paths:
      - "website/**"
      - ".vale.ini"
      - "scripts/check-snippet-regions.sh"
      - ".github/workflows/docs.yml"

env:
  NODE_VERSION: "20"

permissions: {}

jobs:
  changes-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed' && !startsWith(github.head_ref, 'release-please--'))
    outputs:
      docs: ${{ steps.filter.outputs.any_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Changed Files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: filter
        with:
          files: |
            website/**
            .vale.ini
            scripts/check-snippet-regions.sh
            .github/workflows/docs.yml

  build:
    name: build-site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: ${{ needs.changes-docs.outputs.docs == 'true' }}
    needs:
      - changes-docs
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Vet Go snippets
        run: go vet -tags snippets ./website/snippets/

      - name: Check snippet regions
        run: ./scripts/check-snippet-regions.sh

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build docs
        working-directory: website
        run: npm run build

      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site
          path: website/build

  lint:
    name: lint-md
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    if: ${{ needs.changes-docs.outputs.docs == 'true' }}
    needs:
      - changes-docs
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Docs linting is scoped by event type (#661):
      #   * PRs lint only the markdown files changed relative to the base,
      #     so pre-existing violations in untouched files can't gate an
      #     unrelated docs change.
      #   * main pushes keep the full-tree scan — that is where whole-repo
      #     drift (which PR scoping deliberately ignores) gets caught.
      # Both scopes include the versioned copies under website/versioned_docs:
      # backport fixes to frozen pages (contributing/release-branches) must
      # stay lint-clean too, not just website/docs.
      # Scoping is done at the file level here rather than handing reviewdog
      # filter_mode: added — vale-action never passes a diff command, so that
      # combination dies with "diff command is empty" even on clean runs.
      # The Vale binary itself is pinned: rule packs drift between releases,
      # and an unpinned bump once failed every docs PR overnight.
      - name: Changed markdown files
        id: changed-md
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          # Newline-delimited so vale-action can split the list below — its
          # default (a single space-joined string) isn't an existing path,
          # which makes vale-action silently fall back to linting ".".
          separator: "\n"
          files: |
            website/docs/**/*.md
            website/versioned_docs/**/*.md

      - name: Vale Linter (full site)
        if: github.event_name != 'pull_request'
        uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # 3.0.0
        with:
          fail_on_error: true
          files: |
            website/docs
            website/versioned_docs
          # Multiline `files` needs this: without a separator vale-action
          # treats the whole string as one path, doesn't find it, and falls
          # back to linting "." — which is how a main push once failed on
          # hundreds of pre-existing violations outside website/.
          separator: "\n"
          level: error
          version: 3.18.0

      - name: Vale Linter (changed content)
        if: >-
          github.event_name == 'pull_request' &&
          steps.changed-md.outputs.any_changed == 'true'
        uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # 3.0.0
        with:
          fail_on_error: true
          files: ${{ steps.changed-md.outputs.all_changed_files }}
          separator: "\n"
          level: error
          version: 3.18.0

  deploy:
    name: deploy-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # required: pushes built site to gh-pages branch
    needs:
      - build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download site artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: site
          path: website/build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          branch: gh-pages
          folder: website/build
          clean: true
          # Keep live PR previews (deploy-preview job) intact on prod deploys.
          clean-exclude: pr-preview/

  deploy-preview:
    name: deploy-preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # required: pushes PR preview to gh-pages branch
      pull-requests: write
    # Fork PRs get a read-only token, so previews are same-repo only. Runs on
    # `closed` too (without the build steps) so the preview gets removed.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'release-please--')
    concurrency: docs-preview-${{ github.ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        if: github.event.action != 'closed'
        working-directory: website
        run: npm ci

      - name: Build docs for preview path
        if: github.event.action != 'closed'
        working-directory: website
        env:
          DOCS_BASE_URL: /servicenow-sdk-go/pr-preview/pr-${{ github.event.number }}/
        run: npm run build

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: website/build
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto

  remove-report-failure:
    name: Remove Docs Failure Comment
    if: success() && github.event_name == 'pull_request'
    needs: [build, lint, deploy-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Remove Failure Summary
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: docs-failure-summary
          delete: true

  report-failure:
    name: Report Docs Failure
    if: failure() && github.event_name == 'pull_request'
    needs: [build, lint, deploy-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Post Failure Summary
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: docs-failure-summary
          message: |
            ### ❌ Documentation CI/CD Failed
            One or more jobs in the Documentation pipeline failed.

            Please check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
