name: Go Vulnerability Check

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version to use (e.g. stable, oldstable, 1.20)"
        required: false
        default: "stable"
        type: string
      go-package:
        description: "Go package path to scan (e.g. ./...)"
        required: false
        default: "./..."
        type: string
      work-dir:
        description: "Directory of the Go module to scan"
        required: false
        default: "."
        type: string
      build-tags:
        description: "Comma-separated Go build tags to scan with"
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  govulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # govulncheck via default checkout handled by action
    steps:
      - name: Run govulncheck
        env:
          # The action has no build-tags input; govulncheck reads the tags from GOFLAGS.
          GOFLAGS: ${{ inputs.build-tags != '' && format('-tags={0}', inputs.build-tags) || '' }}
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: ${{ inputs.go-version }}
          go-package: ${{ inputs.go-package }}
          work-dir: ${{ inputs.work-dir }}
          cache-dependency-path: ${{ inputs.work-dir }}/go.sum
