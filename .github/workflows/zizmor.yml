name: GitHub Actions Security Analysis with zizmor 🌈

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1" # Weekly Monday 05:00 UTC — after Scorecard (01:30), CI (Tue 03:00)

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Run zizmor 🌈
    permissions:
      contents: read # checkout
      security-events: write # SARIF upload to code scanning
      actions: read # upload-sarif workflow metadata (private repos)
    uses: ./.github/workflows/reusable-zizmor.yaml
    with:
      advanced-security: true

  lint-static:
    name: Lint workflows and scripts
    # Skipped on schedule and manual runs, which exist for the zizmor scan.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install only the two pinned linters from mise.toml. The cache stays
      # off so a poisoned cache cannot reach this job.
      - name: Install actionlint and shellcheck
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: actionlint shellcheck
          cache: false

      - name: Run actionlint and shellcheck
        run: mise run ci:lint:static
