name: PR Checks
on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
    branches:
      - main
      - "release/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-title:
    name: Validate PR Title
    permissions:
      pull-requests: write # post/remove sticky comment for title lint
      contents: read # read PR metadata
    uses: ./.github/workflows/reusable-lint-pr-title.yaml

  dependabot-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    permissions:
      contents: write # gh pr merge --auto needs write to enable auto-merge
      pull-requests: write # enable auto-merge
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Auto-merge waits for the base branch's required checks. Without any
      # branch protection, nothing makes it wait, and `gh pr merge --auto`
      # would merge before CI finishes. So skip auto-merge until the base
      # branch has rules again (NerdIT-Tech/infra-terraform#134).
      - name: Check that the base branch is protected
        id: protection
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          rules="$(gh api "repos/$REPO/rules/branches/$BASE_REF" --jq 'length')"
          if [[ "$rules" -gt 0 ]]; then
            echo "protected=true" >> "$GITHUB_OUTPUT"
          else
            echo "protected=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$BASE_REF has no branch rules, so auto-merge is skipped. Merge this PR by hand after CI passes."
          fi

      # The repository allows squash and rebase merges, not merge commits.
      - name: Enable auto-merge for Dependabot PRs
        if: ${{ steps.protection.outputs.protected == 'true' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
