name: PR Checks
on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
    branches:
      - main
      - "release/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-title:
    name: Validate PR Title
    permissions:
      pull-requests: write # post/remove sticky comment for title lint
      contents: read # read PR metadata
    uses: ./.github/workflows/reusable-lint-pr-title.yaml

  dependabot-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    permissions:
      contents: write # gh pr merge --auto needs write to enable auto-merge
      pull-requests: write # enable auto-merge
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Auto-merge waits for the base branch's required checks. Without any
      # branch protection, nothing makes it wait, and `gh pr merge --auto`
      # would merge before CI finishes. So skip auto-merge until the base
      # branch has rules again (NerdIT-Tech/infra-terraform#134).
      - name: Check that the base branch is protected
        id: protection
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          rules="$(gh api "repos/$REPO/rules/branches/$BASE_REF" --jq 'length')"
          if [[ "$rules" -gt 0 ]]; then
            echo "protected=true" >> "$GITHUB_OUTPUT"
          else
            echo "protected=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$BASE_REF has no branch rules, so auto-merge is skipped. Merge this PR by hand after CI passes."
          fi

      # The repository allows squash and rebase merges, not merge commits.
      - name: Enable auto-merge for Dependabot PRs
        if: ${{ steps.protection.outputs.protected == 'true' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Fails a PR that adds or updates a dependency with a high-severity advisory
  # or a license outside the allowlist. The action compares the dependency
  # graph of the base and head commits, so it reports nothing on a PR that
  # changes no dependencies (go.mod, go.sum, website/package-lock.json).
  # govulncheck (reusable-govulncheck.yaml) still checks reachable
  # vulnerabilities in the code; the two checks complement each other.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # read the dependency diff between base and head
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The allowlist comes from the licenses the repository's dependency graph
      # reports today (Go modules and website npm packages). Add a license here
      # only after you confirm it fits the project's license.
      # No PR comment: Dependabot PRs get a read-only token, so the result goes
      # to the job summary instead.
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
          allow-licenses: >-
            0BSD,
            Apache-2.0,
            BlueOak-1.0.0,
            BSD-2-Clause,
            BSD-3-Clause,
            CC-BY-4.0,
            CC0-1.0,
            EPL-2.0,
            ISC,
            LicenseRef-scancode-google-patent-license-golang,
            LicenseRef-scancode-public-domain,
            LicenseRef-scancode-unicode,
            MIT,
            MIT-0,
            MPL-1.1,
            MPL-2.0,
            Python-2.0,
            Unlicense,
            WTFPL
