name: Docs Archive

# Publishes a frozen build of the docs site for a release line, built from the
# release tag, to GitHub Pages under /servicenow-sdk-go/<X.Y>/. The main site's
# version dropdown links to each line listed in website/archived-versions.json.
#
# Runs on every stable vX.Y.Z tag, so a patch release refreshes its line's
# archive. Older-major maintenance tags archive their own line too, because
# the build uses the tag's docs, not main's. Preview tags are skipped.
#
# Run it by hand (workflow_dispatch) to archive or rebuild a line from an
# existing tag. The run refuses a tag that isn't the newest patch of its line,
# so a rebuild can't replace an archive with older docs.
#
# The build wraps the tag's own docusaurus.config.ts with
# website/archive/docusaurus.archive.config.ts from main. See that file for
# what the archive changes.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag to archive, such as v2.1.1"
        type: string
        required: true

# One run per tag at a time. A second run for the same tag waits instead of
# canceling the first, so a publish is never cut off halfway.
concurrency:
  group: docs-archive-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  resolve:
    name: Resolve Release Line
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read release tags
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
      tag: ${{ steps.guard.outputs.tag }}
      line: ${{ steps.guard.outputs.line }}
    steps:
      - name: Decide whether to archive
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          # Stable releases only; preview tags carry a -preview suffix.
          if [[ ! "$TAG_NAME" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "::notice::${TAG_NAME} is not a stable vX.Y.Z tag; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          line="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"

          # Only the newest patch of a line may publish its archive.
          newest="$(gh api "repos/${REPO}/git/matching-refs/tags/v${line}." --jq '.[].ref' \
            | sed 's#^refs/tags/##' \
            | grep -E "^v${line//./\\.}\.[0-9]+$" \
            | sort -V | tail -n1 || true)"
          if [[ -z "$newest" ]]; then
            echo "::error::Tag ${TAG_NAME} doesn't exist."
            exit 1
          fi
          if [[ "$newest" != "$TAG_NAME" ]]; then
            echo "::notice::${TAG_NAME} isn't the newest ${line} tag (${newest} is); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "skip=false"
            echo "tag=${TAG_NAME}"
            echo "line=${line}"
          } >> "$GITHUB_OUTPUT"

  archive:
    name: Build and Publish Archive
    needs: resolve
    if: needs.resolve.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # pushes the archive build to the gh-pages branch
    # Shares the stable deploy's group, so two pushes to gh-pages never race.
    concurrency:
      group: docs-stable-deploy
      cancel-in-progress: false
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
          persist-credentials: false

      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          path: release
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          # No dependency cache, per zizmor's cache-poisoning audit. The
          # `cache` input takes a package manager name, so leave it unset.
          package-manager-cache: false

      - name: Build the archive
        working-directory: release/website
        env:
          DOCS_ARCHIVE_VERSION: ${{ needs.resolve.outputs.line }}
          DOCS_BASE_URL: /servicenow-sdk-go/${{ needs.resolve.outputs.line }}/
          DOCS_ANALYTICS_DOMAIN: michaeldcanady.github.io
        run: |
          set -euo pipefail
          cp ../../main/website/archive/docusaurus.archive.config.ts .
          npm ci
          npx docusaurus build --config docusaurus.archive.config.ts

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: release/website/build
          target-folder: ${{ needs.resolve.outputs.line }}
          # Replaces only this line's folder; the rest of gh-pages stays.
          clean: true

  register:
    name: Add Line to the Version Dropdown
    needs: [resolve, archive]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the dropdown update branch
      pull-requests: write # open the dropdown update PR
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Add the line to archived-versions.json
        id: list
        env:
          LINE: ${{ needs.resolve.outputs.line }}
        run: |
          set -euo pipefail
          file=website/archived-versions.json
          if jq -e --arg line "$LINE" 'index($line) != null' "$file" > /dev/null; then
            echo "::notice::${LINE} is already in the version dropdown."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Newest first, compared as versions rather than strings.
          jq --arg line "$LINE" \
            '. + [$line] | sort_by(split(".") | map(tonumber)) | reverse' \
            "$file" > "${file}.tmp"
          mv "${file}.tmp" "$file"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open the dropdown PR
        if: steps.list.outputs.changed == 'true'
        uses: ./.github/actions/create-pr
        with:
          # Dashes rather than dots keep the name kebab-case, per the
          # <type>/<kebab-description> branch convention.
          branch: chore/docs-archive-${{ needs.resolve.outputs.line }}
          title: "chore(website): link the v${{ needs.resolve.outputs.line }} docs archive"
          label: no-issue-required
          commit-message: "chore(website): link the v${{ needs.resolve.outputs.line }} docs archive"
          github-token: ${{ github.token }}
          body: |
            The docs-archive workflow published the v${{ needs.resolve.outputs.line }} docs, built from `${{ needs.resolve.outputs.tag }}`, to GitHub Pages under `/servicenow-sdk-go/${{ needs.resolve.outputs.line }}/`.

            This PR adds the line to `website/archived-versions.json`, so the version dropdown links to it and the main site's banner points to it as the latest release.
