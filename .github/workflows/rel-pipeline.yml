name: Release Pipeline

# The single release pipeline for a version tag: attach an SPDX SBOM, sign
# the release artifacts (cosign keyless) and the tag (GPG), then re-run the
# quality gate against the tagged ref. Stable Release and Weekly Preview
# Release each call this once after release-please has created the release in
# the same workflow run; this file replaced the separate sbom.yml and
# sign-release.yml workflows they used to call.
#
# Why this is a reusable called in-band, not a `release: published` trigger:
# release-please creates releases as GitHub Actions using the default token,
# and GitHub deliberately does not start new workflow runs from events created
# by GITHUB_TOKEN (the anti-recursion rule). A release-event trigger therefore
# never fires for release-please-created releases, which is exactly what
# happened to v2.0.3. Calling this workflow from the releasing workflow is
# deterministic.
#
# Job order inside the pipeline is load-bearing: the SBOM is attached first so
# the source-archive checksums always cover it; verification runs last so a
# broken artifact cannot pass a broken gate. The verification job is a thin
# caller of the local quality gate with the `ref` set to the tagged ref, so
# release verification is literally the same check as PR verification.
#
# Backfill an older release by dispatching this workflow with the `tag` input
# set to the existing tag.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag name to attach provenance assets to and verify (for example v2.0.3)
        required: true
        type: string
    secrets:
      GPG_SIGNING_KEY:
        description: "GPG key used to re-create the tag as a signed annotated tag; empty skips tag signing"
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Tag name to attach provenance assets to and verify (for example v2.0.3)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-pipeline-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  sbom:
    name: Generate and Attach SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # upload SBOM asset to the GitHub release
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Install Syft (pinned version with checksum verification)
        env:
          SYFT_VERSION: "1.41.0"
        run: |
          curl -sSfL -o syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o syft_checksums.txt \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_checksums.txt"
          # Verify the downloaded archive against the published checksum for this exact asset.
          EXPECTED=$(awk -v v="${SYFT_VERSION}" \
            '$2 == ("syft_" v "_linux_amd64.tar.gz") {print $1}' syft_checksums.txt)
          echo "${EXPECTED}  syft.tar.gz" | sha256sum -c -
          tar -xzf syft.tar.gz syft
          sudo mv syft /usr/local/bin/syft
          rm -f syft.tar.gz syft_checksums.txt

      - name: Generate SBOM (SPDX format)
        run: |
          syft . -o spdx-json=sbom.spdx.json

      - name: Find release ID for the tag
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          TAG_NAME="${RELEASE_TAG}"
          RELEASE_ID=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" \
            | jq -r '.id')

          if [ -z "${RELEASE_ID}" ] || [ "${RELEASE_ID}" = "null" ]; then
            echo "release_id=" >> "${GITHUB_OUTPUT}"
          else
            echo "release_id=${RELEASE_ID}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check for existing SBOM asset and upload
        if: steps.release.outputs.release_id != '' && steps.release.outputs.release_id != 'null'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          # Check if an SBOM asset with this name already exists in the release
          ASSET_ID=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
            | jq -r ".[] | select(.name == \"sbom.spdx.json\") | .id")

          if [ -n "${ASSET_ID}" ] && [ "${ASSET_ID}" != "null" ]; then
            # Delete existing SBOM asset so we can re-upload the fresh scan
            curl -s -X DELETE -H "Authorization: token ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" > /dev/null
            echo "Deleted existing sbom.spdx.json asset"
          fi

          # Upload the SBOM as a release asset. The name query parameter is
          # required by the GitHub uploads API; without it the POST fails with
          # an HTTP 422, so capture the response code and fail loudly rather
          # than silently reporting success.
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/spdx+json" \
            --data-binary @sbom.spdx.json \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=sbom.spdx.json")
          if [ "${HTTP_CODE}" != "201" ]; then
            echo "::error::Failed to upload sbom.spdx.json to release ${RELEASE_ID} (HTTP ${HTTP_CODE})"
            exit 1
          fi
          echo "Uploaded sbom.spdx.json to release ${RELEASE_ID}"

      - name: Notify if no release found for tag
        if: steps.release.outputs.release_id == '' || steps.release.outputs.release_id == 'null'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          echo "::notice::No GitHub Release found for tag $RELEASE_TAG. The SBOM was generated at ./sbom.spdx.json but was not attached to a release. Ensure the release was published by the release-please process or manually create a release draft."

  sign:
    name: Sign Release Artifacts (cosign keyless)
    needs: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # upload signature assets to the GitHub release
      id-token: write # OIDC identity for keyless signing
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Find release ID for the tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            | jq -r '.id')

          if [ -z "${RELEASE_ID}" ] || [ "${RELEASE_ID}" = "null" ]; then
            echo "release_id=" >> "${GITHUB_OUTPUT}"
          else
            echo "release_id=${RELEASE_ID}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Download release artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          mkdir -p artifacts
          # GitHub auto-generates the source archives when the release is
          # created; download the exact bytes that consumers fetch.
          curl -sSfL -o "artifacts/${REPO_NAME}-${RELEASE_TAG}.tar.gz" \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${RELEASE_TAG}.tar.gz"
          curl -sSfL -o "artifacts/${REPO_NAME}-${RELEASE_TAG}.zip" \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${RELEASE_TAG}.zip"
          # The SBOM job runs first in this pipeline, so the SBOM is already
          # attached. A standalone backfill may run first, so a missing SBOM is
          # a notice, not an error.
          if ! curl -sSfL -o "artifacts/sbom.spdx.json" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/sbom.spdx.json"; then
            echo "::notice::sbom.spdx.json not available yet; SHA256SUMS covers only the source archives."
          fi

      - name: Generate SHA256SUMS
        run: |
          ( cd artifacts && sha256sum -- * ) > SHA256SUMS

      - name: Sign SHA256SUMS with cosign (keyless)
        run: |
          cosign sign-blob --bundle SHA256SUMS.sigstore.json --yes SHA256SUMS

      - name: Verify the signature
        run: |
          # Verify against this workflow's own OIDC identity so a broken sign
          # fails the job loudly instead of shipping garbage data.
          cosign verify-blob \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/rel-pipeline\\.yml@.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            SHA256SUMS

      - name: Upload signature assets to the release
        if: steps.release.outputs.release_id != '' && steps.release.outputs.release_id != 'null'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          for ASSET in SHA256SUMS SHA256SUMS.sigstore.json; do
            ASSET_ID=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
              | jq -r ".[] | select(.name == \"${ASSET}\") | .id")

            if [ -n "${ASSET_ID}" ] && [ "${ASSET_ID}" != "null" ]; then
              curl -s -X DELETE -H "Authorization: token ${GITHUB_TOKEN}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" > /dev/null
              echo "Deleted existing ${ASSET} asset"
            fi

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${ASSET}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${ASSET}")
            if [ "${HTTP_CODE}" != "201" ]; then
              echo "::error::Failed to upload ${ASSET} to release ${RELEASE_ID} (HTTP ${HTTP_CODE})"
              exit 1
            fi
          done
          echo "Uploaded SHA256SUMS and SHA256SUMS.sigstore.json to release ${RELEASE_ID}"

      - name: Notify if no release found for tag
        if: steps.release.outputs.release_id == '' || steps.release.outputs.release_id == 'null'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          echo "::notice::No GitHub Release found for tag $RELEASE_TAG. The signature files were produced at ./SHA256SUMS and ./SHA256SUMS.sigstore.json but were not attached to a release."

  sign-tag:
    name: Sign Release Tag (GPG)
    needs: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # overwrite the lightweight tag with the signed annotated tag
    steps:
      - name: Check signing key
        id: key
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          if [ -z "${GPG_SIGNING_KEY}" ]; then
            echo "::notice::GPG_SIGNING_KEY secret not configured; skipping tag signing. See the signing setup notes in this repo's release docs."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the tag
        if: steps.key.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Import GPG signing key
        if: steps.key.outputs.configured == 'true'
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          echo "${GPG_SIGNING_KEY}" | gpg --batch --import
          gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/ {print $10; exit}' > /tmp/gpg-fingerprint
          if [ ! -s /tmp/gpg-fingerprint ]; then
            echo "::error::No secret key imported from the GPG_SIGNING_KEY secret"
            exit 1
          fi

      - name: Re-create and push signed annotated tag
        if: steps.key.outputs.configured == 'true'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FINGERPRINT=$(cat /tmp/gpg-fingerprint)

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.signingkey "${FINGERPRINT}"
          git config tag.gpgsign true

          # release-please created a lightweight tag through the git API.
          # Re-create it as an annotated, GPG-signed tag on the same commit
          # (HEAD after checkout) and force-push so the signed ref replaces
          # the lightweight one.
          git tag -f -a -s "${RELEASE_TAG}" HEAD -m "Release ${RELEASE_TAG}"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/${RELEASE_TAG}"
          echo "Pushed signed annotated tag ${RELEASE_TAG}"

  verify:
    name: Verify Release Against Full Quality Gate
    needs: [sign, sign-tag]
    permissions:
      contents: read # checkout and verification via the quality gate
    uses: ./.github/workflows/quality-gate.yml
    with:
      ref: ${{ format('refs/tags/{0}', inputs.tag) }}