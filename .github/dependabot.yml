version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /tests/integration/v2
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        update-types:
          - minor
          - patch

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      website-dependencies:
        update-types:
          - minor
          - patch

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
