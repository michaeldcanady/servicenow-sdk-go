version: "2"
run:
  build-tags:
    - preview.query
linters:
  enable:
    - dogsled
    - errcheck
    - gocognit
    - gocyclo
    - gosec
    - misspell
    - nakedret
    - staticcheck
    - unconvert
    - unparam
    - whitespace
    - revive
    - errorlint
    - testifylint
    - errname
    - bodyclose
    - noctx
    - importas
    - goheader
  settings:
    dupl:
      threshold: 200
    revive:
      rules:
        - name: exported
          disabled: false
    importas:
      alias:
        - pkg: github.com/microsoft/kiota-abstractions-go
          alias: abstractions
        - pkg: github.com/microsoft/kiota-abstractions-go/store
          alias: kiotaStore
        - pkg: github.com/microsoft/kiota-http-go
          alias: nethttplibrary
        - pkg: github.com/michaeldcanady/servicenow-sdk-go/errors
          alias: snerrors
        - pkg: github.com/michaeldcanady/servicenow-sdk-go/internal/http
          alias: internalhttp
        - pkg: github.com/michaeldcanady/servicenow-sdk-go/internal/serialization
          alias: internalSerialization
        - pkg: github.com/michaeldcanady/servicenow-sdk-go/internal/store
          alias: internalStore
    goheader:
      values:
        regexp:
          # Deliberately NOT the builtin {{ YEAR }} (which pins to the current
          # year and would fail every file annually). A custom regexp means
          # each file keeps its own static creation year (2021 for the
          # backfill, current year for new files) with zero annual churn.
          YEAR: '20\d{2}'
      # Must match scripts/license-header.tmpl (addlicense output) byte-for-byte:
      # holder, year, SPDX line order — matched line-for-line against the
      # leading comment block of each .go file.
      template: |-
        Copyright (c) {{ YEAR }} Michael Canady
        SPDX-License-Identifier: MIT
  exclusions:
    generated: lax # exclude "// Code generated ... DO NOT EDIT." files (default, stated explicitly)
    rules:
      - linters:
          - dupl
          - errcheck
          - gocyclo
          - gosec
          - typecheck
        path: _test\.go
      - linters:
          - bodyclose
        path: internal/oauth2/client_test\.go
        text: "response body must be closed"
      - linters:
          - revive
        path: internal/mocking/(mock_request_adapter|mock_backing_store)\.go
        text: "var-naming:.*(SetBaseUrl|GetBaseUrl|SubscribeWithId)"
      - linters:
          - revive
        path: internal/
        text: "^exported:"
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - docs/assets/snippets/.*\.go$
      # Defensive: never force a header onto generated files via the path
      # convention either (the `generated: lax` exclusion already covers
      # "// Code generated ... DO NOT EDIT." markers).
      - .*\.gen\.go$
      - .*_generated\.go$
      - .*/generated/.*\.go$
formatters:
  enable:
    - gofmt
