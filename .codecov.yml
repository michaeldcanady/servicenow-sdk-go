# Codecov is an informational report, not a gate. The patch coverage floor in
# .github/workflows/reusable-test-go.yaml ("Check patch coverage floor") gates
# pull requests. `informational: true` makes the Codecov statuses always pass,
# so do not add them to branch protection as required checks.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
comment:
  layout: "reach, diff, flags, files"
  behavior: default
