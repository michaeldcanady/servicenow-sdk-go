# Tool versions for local development and checks.
#
# Run `mise install` to install every tool below. Where CI pins a version,
# this file uses the same one, so a check you run locally matches the check
# that runs on your pull request. Where CI installs the latest release, this
# file pins the release that was current when it was last updated.
#
# When you change a version that CI also pins, change the CI pin in the same
# pull request. The CI location is noted next to each tool.

[tools]
# CI runs a matrix of the "stable" and "oldstable" Go releases
# (.github/workflows/ci.yml). This pin tracks "stable"; the go:test:oldstable
# task pins "oldstable".
go = "1.27"

# Docs site build (.github/actions/docs-build, node-version).
node = "20"

# .github/workflows/reusable-lint-go.yaml, golangci-lint-version default.
golangci-lint = "2.14.0"

# .github/workflows/reusable-docs-gate.yaml and docs-preview.yml, vale-version.
vale = "3.18.0"

# .github/workflows/reusable-zizmor.yaml, version default.
zizmor = "1.29.0"

# CI installs the latest govulncheck (golang/govulncheck-action).
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

# CI installs the latest tparse (.github/actions/install-tparse).
"go:github.com/mfridman/tparse" = "0.18.0"

# Not run in CI yet. Used by the local ci:lint task.
actionlint = "1.7.12"
shellcheck = "0.11.0"

# Tasks. Run `mise tasks` to list them, and `mise run <task>` to run one.
# Tasks that need a script live in .mise/tasks/.

# Go

[tasks."go:build"]
description = "Build every package"
run = "go build ./..."

[tasks."go:test"]
description = "Run the unit tests"
run = "go test -v ./..."

[tasks."go:test:oldstable"]
description = "Run the unit tests on the oldstable Go release, as CI does"
# CI's "oldstable" Go release. Update this when go above moves to a new release.
tools = { go = "1.26" }
run = "go test -v ./..."

[tasks."go:test:integration"]
description = "Run the mocked integration tests, as CI does"
dir = "{{config_root}}/tests/integration/v2"
env = { SN_OFFLINE = "true", SN_INSTANCE = "mock_instance", SN_USERNAME = "mock_user", SN_PASSWORD = "mock_password" }
run = "go test -tags integration ./..."

[tasks."go:test:e2e"]
description = "Run the e2e tests against the live instance in .env"
dir = "{{config_root}}/tests/integration/v2"
env = { SN_OFFLINE = "false" }
run = "go test -tags e2e ./... -timeout 40m -v"

[tasks."go:test:coverage"]
description = "Run the unit tests and write coverage.html"
run = "./scripts/test.sh --report"

[tasks."go:test:report"]
description = "Run the unit tests and print a Markdown test report"
run = "./scripts/test.sh --md-report"

[tasks."go:fmt"]
description = "Format all Go files"
run = "gofmt -s -w ."

[tasks."go:lint"]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks."go:deps:check"]
description = "Verify and check go mod tidy drift in both Go modules, as CI does"
run = """
status=0
for dir in . tests/integration/v2; do
  echo "== $dir"
  (cd "$dir" && go mod verify && go mod tidy -diff) || status=1
done
exit "$status"
"""

[tasks."go:vuln"]
description = "Run govulncheck in both Go modules"
# CI's Vulnerability Scan job scans only the root module.
run = """
status=0
for dir in . tests/integration/v2; do
  echo "== $dir"
  (cd "$dir" && govulncheck ./...) || status=1
done
exit "$status"
"""

# Docs site

[tasks."docs:setup"]
description = "Install the docs site dependencies"
dir = "{{config_root}}/website"
run = "npm ci"

[tasks."docs:serve"]
description = "Serve the docs site locally with live reload"
dir = "{{config_root}}/website"
run = "npm start"

[tasks."docs:build"]
description = "Build the static docs site without serving it"
dir = "{{config_root}}/website"
run = "npm run build"

[tasks."docs:clean"]
description = "Remove the docs site build output"
run = "rm -rf website/build website/.docusaurus"

[tasks."docs:snippets"]
description = "Vet the doc code snippets and check their region markers"
run = [
  "go vet -tags snippets ./website/snippets/",
  "./scripts/check-snippet-regions.sh",
]

[tasks."docs:lint"]
description = "Run Vale on the whole docs site, as Documentation Stable does"
run = [
  "vale sync",
  "vale --minAlertLevel=error website/docs website/versioned_docs",
]

# License headers

[tasks."license:add"]
description = "Add license headers to in-scope source files"
run = "./scripts/add-license.sh"

[tasks."license:check"]
description = "Check that in-scope source files carry license headers"
run = "./scripts/add-license.sh --check-only"

# CI configuration

[tasks."ci:lint"]
description = "Run zizmor, actionlint, and shellcheck on the CI configuration and scripts"
# CI runs zizmor with these settings (reusable-zizmor.yaml). actionlint and
# shellcheck don't run in CI yet, so they fail only on warnings and errors.
# Set GH_TOKEN to run the zizmor audits that need the GitHub API, as CI does.
env = { SHELLCHECK_OPTS = "--severity=warning" }
run = [
  "zizmor --persona=auditor --collect=all --min-severity=informational --min-confidence=low .",
  "actionlint",
  "shellcheck scripts/*.sh .mise/tasks/pr/* .mise/tasks/docs/lint/*",
]

# Pre-push checks
#
# These checks run only in CI, because they need GitHub or a service account:
# CodeQL, OpenSSF Scorecard, OpenCode Review, GitGuardian, the linked-issue
# check, and the e2e tests on the live instance (run go:test:e2e with your own
# .env instead).

[tasks.check]
description = "Run every check that a pull request runs and that works locally"
depends = [
  "go:build",
  "go:lint",
  "go:test",
  "go:test:oldstable",
  "go:test:integration",
  "go:deps:check",
  "go:vuln",
  "docs:snippets",
  "docs:lint:changed",
  "license:check",
  "ci:lint",
  "pr:branch",
  "pr:title",
]

[tasks."check:all"]
description = "Run check, plus the full-site Vale run and the docs build that run after merge"
depends = ["check", "docs:lint", "docs:build"]
